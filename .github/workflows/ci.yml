name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts pula o postinstall (electron-builder install-app-deps,
      # que recompila o better-sqlite3 pra ABI do Electron). No CI a gente roda
      # tudo sob Node, então recompila pra ABI do Node.
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Build (electron-vite)
        run: npm run build

      - name: Tests
        run: npm test
